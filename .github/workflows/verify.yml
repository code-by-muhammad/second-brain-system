name: Verify Second Brain
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [linux-ownership]
        required: true
      helper_sha256:
        type: string
        description: Independently reviewed metadata helper SHA256
        required: true
permissions:
  contents: read
concurrency:
  group: linux-ownership-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-ownership:
    if: github.ref == 'refs/heads/feature/posix-linux-ownership-diagnostic' && inputs.scope == 'linux-ownership'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic and unchanged failed harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - name: Check out exact public candidate as evidence only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: afe772bc61fcf747b6a0d8a17ccba67e5104b049
          path: software
          persist-credentials: false
      - name: Read only public source identities and OS ancestor metadata
        shell: bash
        env:
          REVIEWED_HELPER_SHA256: ${{ inputs.helper_sha256 }}
          OBSERVER_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          [[ "$(/usr/bin/git -C software rev-parse HEAD)" == afe772bc61fcf747b6a0d8a17ccba67e5104b049 ]]
          [[ "$(/usr/bin/git -C harness rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ "$REVIEWED_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(sha256sum harness/tests/native_linux_ownership.py | cut -d' ' -f1)" == "$REVIEWED_HELPER_SHA256" ]]
          mkdir reports
          /usr/bin/env -i PATH=/usr/bin:/bin GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$OBSERVER_RUNNER_ENVIRONMENT" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" ImageOS="$ImageOS" ImageVersion="$ImageVersion" /usr/bin/python3.12 -I -B harness/tests/native_linux_ownership.py --helper-sha256 "$REVIEWED_HELPER_SHA256" --receipt "$GITHUB_WORKSPACE/reports/linux-ownership.json"
      - name: Retain bounded public metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-ownership-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/linux-ownership.json
          if-no-files-found: error
          retention-days: 30
