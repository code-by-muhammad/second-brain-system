name: Verify portable brain
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: portable-brain-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      UV_HTTP_TIMEOUT: '60'
      UV_CONCURRENT_DOWNLOADS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.9.16'
          enable-cache: false
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python -m compileall -q app install.py update.py
      - run: uv run --locked python tests/smoke_import.py
      - run: uv export --locked --no-dev --no-hashes --output-file audit-requirements.txt
      - run: uvx --from pip-audit==2.9.0 pip-audit --disable-pip --no-deps -r audit-requirements.txt
